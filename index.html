<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - Knowledge Tester</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "express": "https://aistudiocdn.com/express@^5.1.0",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "bcryptjs": "https://aistudiocdn.com/bcryptjs@^3.0.2",
    "url": "https://aistudiocdn.com/url@^0.11.4",
    "fs/": "https://aistudiocdn.com/fs@^0.0.1-security/"
  }
}
</script>
</head>
<body>
    <div id="animated-bg-container">
        <div class="bg-layer grid-bg"></div>
        <div class="bg-layer starfield"></div>
    </div>

    <main class="welcome-page">
        <div class="welcome-container">
            <div class="logo">
                 <svg class="logo-icon welcome-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:var(--secondary);" />
                            <stop offset="100%" style="stop-color:var(--primary);" />
                        </linearGradient>
                        <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>
                    <g filter="url(#logo-glow)">
                        <!-- Stylized 'K' shape resembling a neural network -->
                        <path class="logo-path" d="M25 20 V 80" stroke="url(#logo-gradient)" stroke-width="6" stroke-linecap="round" fill="none" />
                        <path class="logo-path logo-path-2" d="M75 20 L 40 50 L 75 80" stroke="url(#logo-gradient)" stroke-width="6" stroke-linecap="round" fill="none" />
                        
                        <!-- Nodes -->
                        <circle class="logo-node" cx="25" cy="20" r="5" fill="var(--primary)" />
                        <circle class="logo-node logo-node-2" cx="25" cy="80" r="5" fill="var(--primary)" />
                        <circle class="logo-node logo-node-3" cx="40" cy="50" r="5" fill="var(--primary)" />
                        <circle class="logo-node logo-node-4" cx="75" cy="20" r="5" fill="var(--secondary)" />
                        <circle class="logo-node logo-node-5" cx="75" cy="80" r="5" fill="var(--secondary)" />
                    </g>
                </svg>
            </div>
            <h1 class="welcome-title">Knowledge Tester</h1>
            <p class="welcome-subtitle">An intelligent quiz platform that generates dynamic challenges on various topics using AI. Test and expand your knowledge from easy to expert levels.</p>
            <div class="welcome-actions">
                <a href="/login.html" class="btn btn-primary btn-large">Start Journey</a>
                <a href="/signup.html" class="btn btn-secondary">Create Account</a>
            </div>
        </div>
    </main>
    
    <footer class="cyber-footer">
        <p>⚡ Developed by Awais — Where AI Meets Challenge. ⚡</p>
    </footer>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/main.js" defer></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
