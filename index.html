
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - Knowledge Tester</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "express": "https://aistudiocdn.com/express@^5.1.0",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "bcryptjs": "https://aistudiocdn.com/bcryptjs@^3.0.2",
    "url": "https://aistudiocdn.com/url@^0.11.4",
    "fs/": "https://aistudiocdn.com/fs@^0.0.1-security/"
  }
}
</script>
</head>
<body>
    <div id="animated-bg-container">
        <div class="bg-layer grid-bg" style="opacity: 0.1;"></div>
        <div class="bg-layer starfield" style="opacity: 1;"></div>
    </div>

    <main class="welcome-page">
        <div class="welcome-container">
            <div class="logo">
                 <svg class="logo-icon welcome-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"></feGaussianBlur>
                            <feMerge>
                                <feMergeNode in="blur"></feMergeNode>
                                <feMergeNode in="SourceGraphic"></feMergeNode>
                            </feMerge>
                        </filter>
                    </defs>
                    <g filter="url(#glow-filter)">
                        <path d="M50 15 C 30 15, 30 40, 50 40 C 70 40, 70 15, 50 15 Z" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>
                        <path d="M50 40 C 40 40, 35 50, 35 60 S 40 80, 50 85 C 60 80, 65 70, 65 60 S 60 40, 50 40 Z" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>
                        <line x1="50" y1="40" x2="50" y2="85" stroke="var(--primary)" stroke-width="2.5"></line>
                        <path d="M35 60 C 25 60, 25 50, 30 50" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                        <path d="M65 60 C 75 60, 75 50, 70 50" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                        <path d="M40 30 C 30 30, 25 45, 35 55" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                        <path d="M60 30 C 70 30, 75 45, 65 55" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                        <circle cx="50" cy="15" r="3" fill="var(--primary)"></circle>
                        <circle cx="30" cy="50" r="2.5" fill="var(--secondary)"></circle>
                        <circle cx="70" cy="50" r="2.5" fill="var(--secondary)"></circle>
                        <circle cx="35" cy="55" r="2.5" fill="var(--secondary)"></circle>
                        <circle cx="65" cy="55" r="2.5" fill="var(--secondary)"></circle>
                        <circle cx="50" cy="85" r="3" fill="var(--primary)"></circle>
                    </g>
                </svg>
            </div>
            <h1 class="welcome-title">Knowledge Tester</h1>
            <p class="welcome-subtitle">An intelligent quiz platform that generates dynamic challenges on various topics using AI. Test and expand your knowledge from easy to expert levels.</p>
            <div class="welcome-actions">
                <a href="/login.html" class="btn btn-primary btn-large">Start Journey</a>
                <a href="/signup.html" class="btn btn-secondary">Create Account</a>
            </div>
        </div>
    </main>
    
    <footer class="cyber-footer">
        <p>⚡ Crafted by Awais — <span class="footer-highlight">Code. Mind. Revolution.</span> ⚡</p>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
