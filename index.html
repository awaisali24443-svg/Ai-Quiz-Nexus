<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Quiz Nexus - A multi-topic interactive quiz website to test and expand your knowledge across various fields from easy to expert levels." />
    <meta name="keywords" content="AI, Quiz, Programming, Biology, Science, Technology, IQ Test, Knowledge" />
    <title>AI Quiz Nexus</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "express": "https://aistudiocdn.com/express@^5.1.0",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
</head>
<body>
    <div id="app-container">
        <!-- Animated Backgrounds Container -->
        <div id="animated-bg-container">
            <div class="bg-layer grid-bg" id="grid-bg"></div>
            <div class="bg-layer matrix-bg" id="matrix-bg"><canvas id="matrix-canvas"></canvas></div>
            <div class="bg-layer dna-bg" id="dna-bg"></div>
            <div class="bg-layer circuit-bg" id="circuit-bg"></div>
            <div class="bg-layer starfield" id="starfield"></div>
            <div class="bg-layer islamic-bg" id="islamic-bg"></div>
            <div class="bg-layer history-bg" id="history-bg"></div>
            <div class="bg-layer world-bg" id="world-bg"></div>
            <div class="bg-layer science-bg" id="science-bg"></div>
            <div class="bg-layer math-bg" id="math-bg"></div>
        </div>
        
        <header id="app-header" class="hidden">
             <div class="container header-content">
                <div class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    <h1>AI Quiz Nexus</h1>
                </div>
            </div>
        </header>

        <main>
            <!-- Welcome Screen -->
            <section id="welcome-screen" class="screen">
                <div class="screen-content text-center">
                     <div class="welcome-logo-container">
                        <svg class="welcome-logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="24" y="2.82843" width="29.9411" height="29.9411" rx="6" transform="rotate(45 24 2.82843)" fill="#4A75E6"/>
                            <path d="M24 14.1421L14.1421 24L24 33.8579L33.8579 24L24 14.1421Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        </svg>
                        <span class="welcome-logo-text">AI Quiz Nexus</span>
                    </div>
                    <h2 class="welcome-headline">Master Every Field. Challenge Your Intellect.</h2>
                    <button id="start-journey-btn" class="btn btn-primary btn-large">Start Your Journey</button>
                </div>
            </section>
            
            <!-- Home Screen -->
            <section id="home-screen" class="screen hidden">
                <div class="container">
                    <div class="text-center">
                        <h2 class="screen-title">Choose Your Challenge</h2>
                        <p class="screen-subtitle">Select a topic to test and expand your knowledge.</p>
                    </div>
                    <h3 class="section-title">Explore Topics</h3>
                    <div id="topic-grid" class="topic-grid">
                        <!-- Topic cards will be injected here by script.js -->
                    </div>
                </div>
            </section>

            <!-- Level Screen -->
            <section id="level-screen" class="screen hidden">
                <div class="container text-center">
                    <h2 id="level-topic-title" class="screen-title"></h2>
                    <p id="level-progress-text" class="screen-subtitle"></p>
                    <div class="progress-bar-container">
                        <div id="level-progress-bar" class="progress-bar"></div>
                    </div>
                    <div id="level-grid" class="level-grid">
                        <!-- Level buttons will be injected here by script.js -->
                    </div>
                    <div class="action-buttons">
                        <button id="back-to-topics-btn" class="btn btn-secondary">&larr; Back to Topics</button>
                    </div>
                </div>
            </section>
            
            <!-- Quiz Screen -->
            <section id="quiz-screen" class="screen hidden">
                <div class="container">
                    <div class="quiz-container">
                        <div class="quiz-header">
                            <div id="question-counter">Question X of Y</div>
                        </div>
                        <div class="progress-bar-container quiz-progress">
                            <div id="quiz-progress-bar" class="progress-bar"></div>
                        </div>
                        <div class="quiz-body">
                             <h2 id="question-text"></h2>
                             <div id="options-container" class="options-grid">
                                 <!-- Options will be injected here by script.js -->
                             </div>
                             <div id="quiz-action-buttons" class="action-buttons">
                                 <!-- Submit/Next button will be injected here -->
                             </div>
                        </div>
                    </div>
                </div>
            </section>
            
             <!-- Results Screen -->
            <section id="results-screen" class="screen hidden">
                <div class="container text-center">
                    <h2 class="screen-title">Level Complete!</h2>
                    <p id="results-topic-text" class="screen-subtitle"></p>
                    <div class="final-score">
                        <span id="final-score-value">0</span>/<span id="total-questions-value">10</span>
                    </div>
                    <div class="score-details">
                        <div><p id="correct-answers" class="correct"></p><span>CORRECT</span></div>
                        <div><p id="incorrect-answers" class="incorrect"></p><span>INCORRECT</span></div>
                    </div>
                    <p id="unlock-message" class="unlock-message hidden"></p>
                    <div id="results-action-buttons" class="action-buttons">
                        <!-- Buttons injected by script.js -->
                    </div>
                </div>
            </section>
        </main>
        
        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <p id="loading-text">Loading...</p>
        </div>
        
        <footer id="app-footer" class="hidden">
            <p class="cyber-footer">
                ⚡ Crafted by <span class="glow-strong">Awais</span> — where logic meets attitude ⚡
            </p>
        </footer>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
