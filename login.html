<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Knowledge Tester</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="animated-bg-container">
        <div class="bg-layer grid-bg"></div>
        <div class="bg-layer starfield"></div>
    </div>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme"></button>
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"></feGaussianBlur>
                                <feMerge>
                                    <feMergeNode in="blur"></feMergeNode>
                                    <feMergeNode in="SourceGraphic"></feMergeNode>
                                </feMerge>
                            </filter>
                        </defs>
                        <g filter="url(#glow-filter)">
                            <path d="M50 15 C 30 15, 30 40, 50 40 C 70 40, 70 15, 50 15 Z" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>
                            <path d="M50 40 C 40 40, 35 50, 35 60 S 40 80, 50 85 C 60 80, 65 70, 65 60 S 60 40, 50 40 Z" fill="none" stroke="var(--primary)" stroke-width="2.5"></path>
                            <line x1="50" y1="40" x2="50" y2="85" stroke="var(--primary)" stroke-width="2.5"></line>
                            <path d="M35 60 C 25 60, 25 50, 30 50" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                            <path d="M65 60 C 75 60, 75 50, 70 50" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                            <path d="M40 30 C 30 30, 25 45, 35 55" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                            <path d="M60 30 C 70 30, 75 45, 65 55" fill="none" stroke="var(--secondary)" stroke-width="2"></path>
                            <circle cx="50" cy="15" r="3" fill="var(--primary)"></circle>
                            <circle cx="30" cy="50" r="2.5" fill="var(--secondary)"></circle>
                            <circle cx="70" cy="50" r="2.5" fill="var(--secondary)"></circle>
                            <circle cx="35" cy="55" r="2.5" fill="var(--secondary)"></circle>
                            <circle cx="65" cy="55" r="2.5" fill="var(--secondary)"></circle>
                            <circle cx="50" cy="85" r="3" fill="var(--primary)"></circle>
                        </g>
                    </svg>
                    <h1>Knowledge Tester</h1>
                </div>
                <h2 class="auth-title">Access the Platform</h2>
                <p class="auth-subtitle">Login to continue your journey.</p>
                <form id="login-form">
                    <div id="login-error" class="auth-error hidden"></div>
                    <div class="form-group">
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>
                <div class="auth-separator"><span>OR</span></div>
                <button id="guest-btn" class="btn btn-secondary btn-full">Continue as Guest</button>
                <p class="auth-switch-text">Don't have an account? <a href="/signup.html">Sign Up</a></p>
            </div>
        </div>
    </main>
    
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
