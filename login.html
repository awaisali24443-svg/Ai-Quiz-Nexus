<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Knowledge Tester</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="animated-bg-container">
        <div class="bg-layer grid-bg"></div>
        <div class="bg-layer starfield"></div>
    </div>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme"></button>
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:var(--secondary);" />
                                <stop offset="100%" style="stop-color:var(--primary);" />
                            </linearGradient>
                            <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
                                <feMerge>
                                    <feMergeNode in="blur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                        </defs>
                        <g filter="url(#logo-glow)">
                            <path class="logo-path" d="M25 20 V 80" stroke="url(#logo-gradient)" stroke-width="6" stroke-linecap="round" fill="none" />
                            <path class="logo-path logo-path-2" d="M75 20 L 40 50 L 75 80" stroke="url(#logo-gradient)" stroke-width="6" stroke-linecap="round" fill="none" />
                            <circle class="logo-node" cx="25" cy="20" r="5" fill="var(--primary)" />
                            <circle class="logo-node logo-node-2" cx="25" cy="80" r="5" fill="var(--primary)" />
                            <circle class="logo-node logo-node-3" cx="40" cy="50" r="5" fill="var(--primary)" />
                            <circle class="logo-node logo-node-4" cx="75" cy="20" r="5" fill="var(--secondary)" />
                            <circle class="logo-node logo-node-5" cx="75" cy="80" r="5" fill="var(--secondary)" />
                        </g>
                    </svg>
                    <h1>Knowledge Tester</h1>
                </div>
                <h2 class="auth-title">Access the Platform</h2>
                <p class="auth-subtitle">Login to continue your journey.</p>
                <form id="login-form">
                    <div id="login-error" class="auth-error hidden"></div>
                    <div class="form-group">
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>
                <div class="auth-separator"><span>OR</span></div>
                <button id="guest-btn" class="btn btn-secondary btn-full">Continue as Guest</button>
                <p class="auth-switch-text">Don't have an account? <a href="/signup.html">Sign Up</a></p>
            </div>
             <footer class="cyber-footer">
                <p>Created with intelligence and curiosity by Awais ⚡</p>
            </footer>
        </div>
    </main>
    
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/main.js" defer></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
