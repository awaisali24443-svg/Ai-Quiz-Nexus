
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AI Quiz Nexus</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="animated-bg-container">
        <div class="bg-layer grid-bg"></div>
        <div class="bg-layer starfield"></div>
    </div>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    <h1>AI Quiz Nexus</h1>
                </div>
                <h2 class="auth-title">Access the Nexus</h2>
                <p class="auth-subtitle">Login to continue your journey.</p>
                <form id="login-form">
                    <div id="login-error" class="auth-error hidden"></div>
                    <div class="form-group">
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                </form>
                <div class="auth-separator"><span>OR</span></div>
                <button id="guest-btn" class="btn btn-secondary btn-full">Continue as Guest</button>
                <p class="auth-switch-text">Don't have an account? <a href="/signup.html">Sign Up</a></p>
            </div>
        </div>
    </main>
    
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
