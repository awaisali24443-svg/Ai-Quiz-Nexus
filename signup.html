<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Knowledge Tester</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="animated-bg-container">
        <div class="bg-layer grid-bg"></div>
        <div class="bg-layer starfield"></div>
    </div>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                 <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme"></button>
                 <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:var(--secondary);" />
                                <stop offset="100%" style="stop-color:var(--primary);" />
                            </linearGradient>
                            <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
                                <feMerge>
                                    <feMergeNode in="blur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                        </defs>
                        <g filter="url(#logo-glow)">
                            <path class="logo-path-static" d="M25 20 V 80" stroke="url(#logo-gradient)" stroke-width="6" stroke-linecap="round" fill="none" />
                            <path class="logo-path-static" d="M75 20 L 40 50 L 75 80" stroke="url(#logo-gradient)" stroke-width="6" stroke-linecap="round" fill="none" />
                            <circle class="logo-node-static" cx="25" cy="20" r="5" fill="var(--primary)" />
                            <circle class="logo-node-static" cx="25" cy="80" r="5" fill="var(--primary)" />
                            <circle class="logo-node-static" cx="40" cy="50" r="5" fill="var(--primary)" />
                            <circle class="logo-node-static" cx="75" cy="20" r="5" fill="var(--secondary)" />
                            <circle class="logo-node-static" cx="75" cy="80" r="5" fill="var(--secondary)" />
                        </g>
                    </svg>
                    <h1>Knowledge Tester</h1>
                </div>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join and start your journey.</p>
                <form id="signup-form">
                    <div id="signup-error" class="auth-error hidden"></div>
                    <div class="form-group">
                        <input type="text" id="signup-username" placeholder="Username" required minlength="3">
                        <div id="username-feedback" class="feedback-text"></div>
                    </div>
                    <div class="form-group">
                        <input type="email" id="signup-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="signup-password" placeholder="Password" required minlength="8" pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$" title="Minimum 8 characters, at least one letter and one number.">
                    </div>
                    <div class="form-group">
                        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                </form>
                <p class="auth-switch-text">Already have an account? <a href="/login.html">Login</a></p>
            </div>
        </div>
    </main>

    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/auth.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
